name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  archive: tar.gz }
          - { os: macos-latest,   target: aarch64-apple-darwin,      archive: tar.gz }
          - { os: macos-latest,   target: x86_64-apple-darwin,       archive: tar.gz }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    archive: zip }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          staging=rex-run-${{ github.ref_name }}-${{ matrix.target }}
          mkdir "$staging"
          cp target/${{ matrix.target }}/release/rex-run README.md LICENSE NOTICE "$staging/"
          tar czf "$staging.tar.gz" "$staging"

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $staging = "rex-run-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $staging
          Copy-Item target/${{ matrix.target }}/release/rex-run.exe, README.md, LICENSE, NOTICE $staging
          Compress-Archive -Path $staging -DestinationPath "$staging.zip"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            rex-run-*.tar.gz
            rex-run-*.zip
          generate_release_notes: true
